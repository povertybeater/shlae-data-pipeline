name: SHLAE Daily Lead Data Mining Pipeline

on:
  schedule:
    - cron: '14 10 * * *' # Runs daily at 6:14 AM EDT (10:14 AM UTC) to avoid server congestion
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Data Mining Script
        run: python mine_multi_industry_leads.py

      - name: Upload Leads to shlae.com via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: './'
          server-dir: '../wp-content/uploads/leads/'
          exclude: |
            **/**
            !leads.csv
            !multi_industry_leads.json

      - name: Commit and Push Generated Lead Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          if [ -f leads.csv ] || [ -f multi_industry_leads.json ]; then
            git add multi_industry_leads.json leads.csv
            git diff --staged --quiet || git commit -m "chore: auto-update daily lead data feeds [skip ci]"
            git push
          else
            echo "No lead files generated to commit."
          fi
