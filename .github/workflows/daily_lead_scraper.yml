name: SHLAE Daily Lead Data Mining Pipeline

on:
  schedule:
    # Runs at 06:00 AM UTC (1:00 AM EST) every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  mine-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Mining Script
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python mine_multi_industry_leads.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "SHLAE Automated Data Bot"
          git config --global user.email "bot@shlae.com"
          git add multi_industry_leads.json leads.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily multi-industry leads: $(date +'%Y-%m-%d')" && git push)
