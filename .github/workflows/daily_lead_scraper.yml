name: SHLAE Daily Lead Data Mining Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Data Mining Script
        run: python mine_multi_industry_leads.py

      - name: Upload Leads to shlae.com via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './leads.csv'
          remote_path: '/public_html/wp-content/uploads/leads/'
          sftp_only: true

      - name: Upload Leads JSON to shlae.com via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './multi_industry_leads.json'
          remote_path: '/public_html/wp-content/uploads/leads/'
          sftp_only: true

      - name: Commit and Push Generated Lead Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f leads.csv ] || [ -f multi_industry_leads.json ]; then
            git add multi_industry_leads.json leads.csv
            git diff --staged --quiet || git commit -m "chore: auto-update daily lead data feeds [skip ci]"
            git push
          else
            echo "No lead files generated to commit."
          fi
