name: SHLAE daily Boston leads — newest first, 30 days

on:
  schedule:
    - cron: '14 10 * * *' # 10:14 UTC; local Boston time shifts with daylight saving.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wordpress/shlae-lead-delivery/**'
      - 'daily_leads.py'
      - 'energy_packages.py'
      - 'tests/test_energy_packages.py'
      - 'tests/test_contract_evidence.py'
      - 'tests/test_daily_leads.py'
      - '.github/workflows/daily_lead_scraper.yml'

permissions:
  contents: write

concurrency:
  group: shlae-boston-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install encryption dependency
        run: python -m pip install cryptography==46.0.5

      - name: Test transformations without network
        run: python -m unittest discover -s tests -v

      - name: Build source-backed public previews
        env:
          SHLAE_PRIVATE_FEED_KEY: ${{ secrets.SHLAE_PRIVATE_FEED_KEY }}
          SHLAE_REVIEWED_CONTACTS_JSON: ${{ secrets.SHLAE_REVIEWED_CONTACTS_JSON }}
          SHLAE_REVIEWED_CONTRACTS_JSON: ${{ secrets.SHLAE_REVIEWED_CONTRACTS_JSON }}
        run: python daily_leads.py

      - name: Verify public feed contains no contact fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          feed = Path("public/multi_industry_leads.json")

          if not feed.exists():
              raise SystemExit("ERROR: public/multi_industry_leads.json was not generated")

          data = json.loads(feed.read_text(encoding="utf-8"))

          # Empty successful result intentionally removes expired inventory.

          prohibited = {
              "email",
              "phone",
              "raw_contact",
              "contact_email",
              "contact_phone",
              "business_name",
              "applicant_name",
              "street_address",
              "contact_name",
          }

          for row in data:
              exposed = prohibited & set(row)
              if exposed:
                  raise SystemExit(
                      f"ERROR: Public feed contains prohibited contact fields: {sorted(exposed)}"
                  )

          print(f"Validated {len(data)} public previews")
          PY

      - name: Retain encrypted energy packages for private download
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-energy-packages
          path: private/energy_packages.enc.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Package SHLAE plugin update for manual installation
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          source = Path("wordpress/shlae-lead-delivery/shlae-lead-delivery.php")
          with ZipFile("public/shlae-lead-delivery.zip", "w", ZIP_DEFLATED) as package:
              package.write(source, "shlae-lead-delivery/shlae-lead-delivery.php")
          PY

      - name: Upload public previews and plugin package to SHLAE FTP
        if: ${{ vars.SHLAE_PUBLIC_FEED_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./public/
          server-dir: ./

      - name: Save public previews and stable first-seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/multi_industry_leads.json \
            public/leads.csv \
            public/feed_status.json \
            public/energy_package_status.json \
            state/first_seen.json \
            state/energy_fingerprints.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Boston public previews [skip ci]"
            git push
          else
            echo "No repository changes to commit."
          fi
