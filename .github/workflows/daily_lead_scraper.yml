name: SHLAE Daily Lead Data Mining Pipeline

on:
  schedule:
    # Runs daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual run button in Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-run:
    runs-policy: write
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants write permissions to commit updated lead files

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Lead Mining Script
        run: |
          python mine_multi_industry_leads.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add multi_industry_leads.json leads.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily lead feeds [skip ci]" && git push)
