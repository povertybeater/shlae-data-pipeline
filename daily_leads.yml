name: SHLAE Daily Lead Data Mining Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC
  workflow_dispatch:     # Enables manual test runs from the GitHub Actions web UI

permissions:
  contents: write        # Grants explicit read/write access to commit generated files back to the repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Data Mining Script
        run: |
          python mine_multi_industry_leads.py

      - name: Commit and Push Generated Lead Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add multi_industry_leads.json leads.csv
          git diff --staged --quiet || git commit -m "Auto-update daily lead data [skip ci]"
          git push
