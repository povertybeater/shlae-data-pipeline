name: SHLAE Daily Lead Data Mining Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 6:00 AM UTC
  workflow_dispatch:      # Allows manual triggers from Actions tab

# Explicitly grant read/write permissions for Git commits
permissions:
  contents: write

# Force GitHub Actions runner to use Node 24 runtime
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository using latest Node 24 supported version
      - name: Check out repository
        uses: actions/checkout@v5

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # Step 4: Run data mining script
      - name: Run Lead Scraper
        run: python mine_multi_industry_leads.py

      # Step 5: Commit and push updated datasets back to main branch
      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add multi_industry_leads.json leads.csv
          git diff-index --quiet HEAD || git commit -m "Auto-update lead datasets [skip ci]"
          git push
