name: SHLAE Daily Lead Data Mining Pipeline

on:
  schedule:
    # Runs daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  mine-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      [cite_start]contents: write # Required for committing generated lead files back to repo 

    steps:
      # Step 1: Check out repository contents (Updated to v4)
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment (Updated to v5)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # Step 4: Run the data mining script
      - name: Execute Lead Mining Script
        run: |
          python mine_multi_industry_leads.py

      # Step 5: Commit and push updated lead data files
      - name: Commit and push updated lead data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add multi_industry_leads.json leads.csv || true
          git commit -m "Automated daily lead update [skip ci]" || exit 0
          git push
