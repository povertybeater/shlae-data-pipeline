name: SHLAE Daily Lead Data Mining Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 6:00 AM UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  mine-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <--- REQUIRED FOR GIT PUSH

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Data Mining Script
        run: python mine_multi_industry_leads.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add multi_industry_leads.json leads.csv
          git diff-index --quiet HEAD || git commit -m "Auto-update daily lead data [skip ci]"
          git push
